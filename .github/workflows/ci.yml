name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - uses: Swatinem/rust-cache@v2
      # All git hooks on all files (rustfmt, clippy, nixfmt, taplo), then `enterTest`, which runs
      # the `check` script: fmt, clippy, tests and a no_std build of engine.
      - name: devenv test
        run: devenv test
