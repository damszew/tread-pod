[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.6"
# ESP_IDF_TOOLS_INSTALL_DIR is set by the `fw-*` devenv scripts: ESP-IDF and its tools go to the
# shared ESP cache, so git worktrees don't each download their own copy.
