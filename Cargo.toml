[workspace]
resolver = "3"
members = ["crates/*"]
# Built with the Xtensa `esp` toolchain via the `fw-*` devenv scripts.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
engine = { path = "crates/engine" }

heapless = { version = "0.9", features = ["serde"] }
postcard = "1.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
